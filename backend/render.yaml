services:
  - type: web
    name: portfolio-optimizer-api
    runtime: node
    rootDir: revamp/backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        value: file:./prod.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
